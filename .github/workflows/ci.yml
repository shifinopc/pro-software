# The gate that did not exist.
#
# Until now a push went straight to `main` and from there to a production box holding real passport
# and Iqama numbers, with no review, no type check and no test run. This is the smallest thing that
# closes that: it runs on every pull request and on `main` itself, so a change cannot reach the
# deployable branch without compiling, building and passing the probes.
#
# DELIBERATELY NOT A DEPLOY. Deploying stays a separate, human act. Putting the server's SSH key into
# Actions secrets would trade a key that lives on one laptop for one that lives in a CI system with a
# much larger attack surface — and an auto-deploy to a single production environment with no staging
# is not a safety improvement, it is a faster way to ship a mistake.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push supersedes the first: no value in finishing a run for a commit already replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Types, build and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matched to Dockerfile.api / Dockerfile.web, so CI compiles against what production runs.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install (server)
        working-directory: server
        run: npm ci

      # The client is generated, not committed, and tsc cannot resolve the schema types without it.
      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Type check
        working-directory: server
        run: npx tsc --noEmit

      # The console and portal are one Vite build. A broken template is a blank screen at runtime and
      # nothing else catches it — there are no front-end tests.
      # No `version` input: package.json pins packageManager to pnpm@11.13.0, and passing both makes
      # the action refuse with "multiple versions specified". Reading the pin is also the better
      # answer — CI then builds with exactly the pnpm the repo declares.
      - uses: pnpm/action-setup@v4
      - name: Build the console and portal
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # Runs on every keystroke in the Add client form and is pure, which is the kind of thing that
      # rots unnoticed. Extracted from index.html by the test, so it cannot drift from what ships.
      - name: Arabic name transliteration
        run: node scripts/arabic-name-test.mjs

      # The only code in this repository that deletes backups, plus the logging around it. Needs no
      # database and no Node, so it rides along here rather than in the probes job. The Linux runner
      # also exercises the one case a Windows workstation cannot: that a person at a terminal still
      # sees the running commentary.
      - name: Backup retention and logging
        run: bash stack/backup-test.sh

      # THE CHECKS THAT NEED NOTHING. No database, no server, no network — they read index.html,
      # the schema, or a pure function. They were written one at a time alongside the bugs they
      # found and then only ran when somebody remembered, which is the same as not having them.
      #
      # One step with a loop rather than eleven steps: the log names each script as it runs, and
      # `set -e` stops at the first failure, so the failing one is the last line printed. Eleven
      # near-identical YAML blocks buy a nicer step label and cost a page of config.
      - name: Static checks
        working-directory: server
        run: |
          set -e
          for f in check-date-fields client-ip-check first-paint-check group-counts-check \
                   imap-check island-minify-check lead-details-fields-check node-types-check \
                   number-format-pool-check phone-split-check render-scope-check signature-check \
                   site-lookup-check; do
            echo "── $f"
            npx tsx "scripts/$f.ts"
          done

      # SCA. Fails on high or critical only: moderates that need a major upgrade should not block a
      # bug fix, and a gate that cries wolf is a gate people learn to force past.
      - name: Audit dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

  probes:
    name: Probes
    runs-on: ubuntu-latest
    services:
      db:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: stimespro
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:ci@127.0.0.1:3306/stimespro
      # Present because startup refuses to run without them. Values are throwaway and never leave
      # this container — the point is that the code path is exercised, not that they are secret.
      JWT_SECRET: ci-only-not-a-real-secret-value-0123456789
      CRED_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        working-directory: server
        run: npm ci

      # db push, never migrate deploy: parts of this schema exist only through db push, so a migrate
      # would build a database that does not match the one production runs.
      - name: Create the schema
        working-directory: server
        run: npx prisma db push --skip-generate && npx prisma generate

      # The self-contained probes. Each creates its own country, client and staff, asserts, and
      # deletes everything it made — so they can run in any order against an empty database.
      # The pack-dependent ones (upgrade, uninstall, statutory clocks) need a country pack installed
      # first and are deliberately left out until that is scripted.
      # Money and permissions go first. They are the two places a mistake is most expensive — every
      # invoice depends on the arithmetic, and one middleware applies the matrix to every staff route
      # — and until now neither had a single check. Both are fast: the money probe is pure functions
      # and the permissions probe only writes the two settings rows, which it puts back.
      - name: Business dates
        working-directory: server
        run: npx tsx scripts/probe-dates.ts
      - name: Invoice arithmetic
        working-directory: server
        run: npx tsx scripts/probe-money.ts
      - name: Permission matrix
        working-directory: server
        run: npx tsx scripts/probe-permissions.ts
      - name: Compliance recompute
        working-directory: server
        run: npx tsx scripts/probe-compliance.ts
      - name: Band schemes
        working-directory: server
        run: npx tsx scripts/probe-band-schemes.ts
      - name: Counting rules
        working-directory: server
        run: npx tsx scripts/probe-counting-rules.ts
      - name: Client team
        working-directory: server
        run: npx tsx scripts/probe-client-team.ts

      # The checks that need a database and nothing else. Each makes its own client, user and rows
      # and deletes them, so they run in any order against an empty schema.
      - name: Database checks
        working-directory: server
        run: |
          set -e
          for f in auth-failure-check company-merge-check import-template-check \
                   lead-export-check lead-import-check mail-send-check money-capture-check; do
            echo "── $f"
            npx tsx "scripts/$f.ts"
          done

      # The two that go through the real routes, because what they guard IS the route: an invoice
      # and the disbursements it bills standing or falling together, and a quotation that must not
      # be invoiceable once a revision has replaced it. Both mint their own throwaway user, and
      # both refuse to run unless DATABASE_URL points at localhost — which here it does.
      #
      # The server is started in the background and the job waits for /api/health rather than
      # sleeping: a fixed sleep is either too short on a slow runner or wasted on a fast one.
      - name: Start the API
        working-directory: server
        run: |
          npx tsx src/index.ts > /tmp/api.log 2>&1 &
          API_PID=$!
          for i in $(seq 1 60); do
            # THE PROCESS, NOT JUST THE PORT. Waiting on /api/health alone treats "something is
            # answering on 4100" as "my server started", and a server that was already there
            # answers just as cheerfully — pointed at a different database. That cost me a
            # debugging session locally; here it would be a green run that tested nothing.
            kill -0 "$API_PID" 2>/dev/null || { echo "the API exited while starting:"; cat /tmp/api.log; exit 1; }
            if curl -fsS http://localhost:4100/api/health > /dev/null 2>&1; then
              echo "API up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "the API did not answer within 60s:"; cat /tmp/api.log; exit 1

      - name: Route checks
        working-directory: server
        run: |
          set -e
          for f in disbursement-billing-check quote-convert-check; do
            echo "── $f"
            npx tsx "scripts/$f.ts"
          done

      # What the server said while the checks ran. Printed only on failure — on a green run it is
      # noise, and on a red one it is usually the answer.
      - name: API log
        if: failure()
        run: cat /tmp/api.log

      # NOT WIRED IN, AND WHY. Five more checks exist and are deliberately left out: each needs
      # reference data an empty schema does not have, so in CI they fail for the wrong reason.
      #
      #   paid-gate-check              wants a workflow template named "Iqama Renewal"
      #   read-scan-check              wants the document types and their aliases
      #   probe-deal-checklist         wants the checklist rules
      #   lifecycle-guard-check        wants a seeded staff user whose role actually resolves
      #   probe-checklist-vocabulary   crashes partway and leaves its user behind
      #
      # The first four come good the day this job seeds a country pack, which is the same thing
      # the pack probes above are waiting for. The last one is a bug in the check itself.

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # Full history: a secret removed in a later commit is still readable in the one that added it,
      # which is exactly the case a scan of the working tree would miss.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The official binary rather than gitleaks-action, which requires a paid licence key for
      # organisation-owned repositories and fails closed without one. Same scanner, no licence, no
      # token handed to a third-party action.
      # PINNED, and not resolved from the API at run time. Unauthenticated GitHub API calls from
      # Actions runners share an IP pool and get rate-limited, which is what failed here — but the
      # pin is the right answer regardless: a security tool should be a version somebody chose, not
      # whatever was published this morning.
      - name: Scan the full history
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks version
          ./gitleaks git --no-banner --redact --config .gitleaks.toml --exit-code 1
