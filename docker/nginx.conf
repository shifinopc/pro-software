# Does this client accept brotli? nginx has no brotli module in the official image, so brotli is
# served as a pre-built file rather than compressed on the fly — which is the point: index.html is
# 3.3 MB and marked no-cache, so it was being compressed again for every single visit.
map $http_accept_encoding $br_ok {
    default     0;
    "~*\bbr\b"  1;
}

# Two front ends, one container, chosen by Host header.
#
# The try_files line is the whole reason this file exists. Both apps use clean URLs (/dashboard,
# /portal/invoices) that are rewritten client-side — there is no file at those paths. Without the
# fallback, every URL except "/" returns 404 the moment someone reloads or opens a link directly.
# It is the nginx equivalent of the .htaccess the cPanel build ships.

server {
    listen 80;
    server_name pro.ionob.in;
    root /usr/share/nginx/html/console;
    index index.html;

    # Hashed asset filenames — safe to cache hard. index.html must NOT be, or a deploy ships new
    # assets that the cached HTML never references.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The app document. Every clean URL (/clients, /portal/invoices) has no file behind it and
    # ends up here, so this one location answers almost every page view.
    #
    # index.html.br and index.html.gz are written by scripts/build-deploy.mjs next to index.html.
    # Brotli is picked by hand because the image has no brotli module; gzip_static covers everyone
    # else. Both are guarded on the file actually existing, and the plain index.html remains the
    # fallback, so a build that skipped compression still serves a working page.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Vary "Accept-Encoding" always;
        gzip_static on;

        set $pre "";
        if ($br_ok) { set $pre "br"; }
        if (-f $document_root/index.html.br) { set $pre "${pre}+file"; }
        if ($pre = "br+file") { rewrite ^ /__index_br last; }
    }

    location = /__index_br {
        internal;
        default_type text/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Vary "Accept-Encoding" always;
        add_header Content-Encoding br always;
        try_files /index.html.br =404;
    }

    # The compressed copies are an implementation detail of the location above — nobody should be
    # able to request them directly and get a file with no Content-Encoding on it.
    location ~ \.(br|gz)$ {
        internal;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}

server {
    listen 80;
    server_name cp.ionob.in;
    root /usr/share/nginx/html/portal;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The app document. Every clean URL (/clients, /portal/invoices) has no file behind it and
    # ends up here, so this one location answers almost every page view.
    #
    # index.html.br and index.html.gz are written by scripts/build-deploy.mjs next to index.html.
    # Brotli is picked by hand because the image has no brotli module; gzip_static covers everyone
    # else. Both are guarded on the file actually existing, and the plain index.html remains the
    # fallback, so a build that skipped compression still serves a working page.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Vary "Accept-Encoding" always;
        gzip_static on;

        set $pre "";
        if ($br_ok) { set $pre "br"; }
        if (-f $document_root/index.html.br) { set $pre "${pre}+file"; }
        if ($pre = "br+file") { rewrite ^ /__index_br last; }
    }

    location = /__index_br {
        internal;
        default_type text/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Vary "Accept-Encoding" always;
        add_header Content-Encoding br always;
        try_files /index.html.br =404;
    }

    # The compressed copies are an implementation detail of the location above — nobody should be
    # able to request them directly and get a file with no Content-Encoding on it.
    location ~ \.(br|gz)$ {
        internal;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}

# Anything arriving with an unexpected Host (a bare IP scan, a stale DNS entry) gets nothing rather
# than being silently served the console.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
